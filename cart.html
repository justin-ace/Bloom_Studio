<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bloom Studio | Cart & Checkout</title>
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/cart.css" />
    <link rel="stylesheet" href="assets/css/responsive.css" />
  <link rel="icon" type="image/png" href="assets/images/bloom_favicons/favicon-16x16.png">
  </head>
  <body data-page="cart">
    <div class="page-bg"></div>
    <div class="site-shell">
      <header class="topbar">
        <div class="topbar-inner">
          <a class="brand" href="index.html">Bloom Studio</a>
          <nav class="nav-links">
            <a class="nav-link" href="index.html#ourstory" data-section="ourstory">Our Story</a>
            <a class="nav-link" href="index.html#collections" data-section="collections">Collections</a>
            <a class="nav-link" href="index.html#contact" data-section="contact">Contact</a>
          </nav>
          <a class="topbar-cta" href="index.html#collections">Continue Shopping</a>
        </div>
      </header>

      <section class="checkout-shell">
        <div class="cart-panel">
          <div class="section-heading compact">
            <div>
              <p class="eyebrow">Your order</p>
              <h2>Cart summary</h2>
            </div>
          </div>

          <div id="cartList"></div>

          <div class="cart-empty" id="cartEmpty" hidden>
            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M32 54c-14-6-18-22-10-34 12 0 22 8 22 20-4 6-8 10-12 14Z" stroke="currentColor" stroke-width="2" />
            </svg>
            <h3>Your cart is empty</h3>
            <p>Browse the collection and add a bouquet you love.</p>
            <a class="btn btn-primary" href="index.html#collections">Explore collection</a>
          </div>

          <div class="summary-box" id="orderSummary">
            <div><span>Subtotal</span><strong data-row="subtotal">₱0</strong></div>
            <div><span>Delivery</span><strong data-row="delivery">₱0</strong></div>
            <div><span>Gift wrap</span><strong data-row="giftwrap">₱0</strong></div>
            <div class="total-row"><span>Total</span><strong data-row="total">₱0</strong></div>
          </div>
        </div>

        <div class="checkout-panel">
          <div class="section-heading compact">
            <div>
              <p class="eyebrow">Secure checkout</p>
              <h2>Delivery details</h2>
            </div>
          </div>

          <form class="checkout-form">
            <label>
              Full name
              <input type="text" placeholder="Aisha Green" required />
            </label>
            <label>
              Email address
              <input type="email" placeholder="you@example.com" required />
            </label>
            <label>
              Delivery address
              <input type="text" placeholder="42 Garden Street" required />
            </label>
            <label>
              Delivery note
              <textarea rows="4" placeholder="Leave at the front desk or add a handwritten note."></textarea>
            </label>
            <button class="btn btn-primary" type="submit" disabled>Complete order</button>
          </form>
        </div>
      </section>
    </div>

    <script src="assets/js/icons.js"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/cart-manager.js"></script>
    <script src="assets/js/controllers.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
